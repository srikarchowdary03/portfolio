[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-powered portfolio: RAG pipeline, LangGraph agent, and chat API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "openai>=1.50",
    "python-frontmatter>=1.1",
    "slowapi>=0.1.9",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `app` package importable from tests without installing the project.
pythonpath = ["."]
